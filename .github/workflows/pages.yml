# Publishes the static design preview (public/) to GitHub Pages.
# The full platform (login, lessons, exams, wallet) needs the Node server: npm start.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stamp asset URLs so browsers fetch the new CSS/JS after each deploy
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" public/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
